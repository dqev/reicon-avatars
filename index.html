  <style>
    :root {
      --bg: #0d0d0d;
      --surface-1: #161616;
      --surface-2: #222222;
      --surface-3: #2d2d2d;
      --text: #ffffff;
      --text-alt: #999999;
      --text-muted: #555555;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus, a:focus {
      outline: none;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    /* Header Navigation - Full Width */
    .nav-container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .mobile-menu-btn:hover {
      background: var(--surface-1);
    }

    .menu-icon-svg { display: block; }
    .close-icon-svg { display: none; }
    .mobile-menu-btn.is-open .menu-icon-svg { display: none; }
    .mobile-menu-btn.is-open .close-icon-svg { display: block; }

    .mobile-dropdown {
      display: none;
      position: absolute;
      top: calc(100% - 10px);
      right: 20px;
      left: 20px;
      background: var(--surface-1);
      border-radius: 14px;
      padding: 16px;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .mobile-dropdown.is-open {
      display: flex;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mobile-dropdown-link {
      color: var(--text-alt);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 8px;
      transition: background-color 0.2s, color 0.2s;
    }

    .mobile-dropdown-link:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .mobile-dropdown-btn {
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .nav-btn:hover {
      background: var(--surface-2);
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img,
    .logo-icon {
      width: 28px;
      height: 28px;
      object-fit: cover;
      display: inline-block;
    }

    .nav-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-links a {
      color: var(--text-alt);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: var(--surface-1);
      color: var(--text);
      border: 0;
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .nav-btn:hover {
      background: var(--surface-2);
    }

    /* Hero Section */
    .hero-title-section {
      text-align: center;
      padding: 60px 20px 36px 20px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 550;
      letter-spacing: -0.4px;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.92);
      text-wrap: balance;
      margin: 0 0 20px 0;
    }

    .command-bar {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-1);
      border-radius: 9999px;
      padding: 10px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      color: var(--text-alt);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .command-bar:hover {
      background: var(--surface-2);
    }

    .command-bar .cmd-prefix {
      color: var(--text-muted);
    }

    .command-bar .cmd-text {
      color: var(--text);
    }

    .icon-btn {
      background: transparent;
      border: 0;
      color: var(--text-alt);
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s, background-color 0.2s;
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    /* Full Max Width Grid Wrapper */
    .layout-wrapper {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 0 20px 60px 20px;
    }

    /* Unified CSS Grid System */
    .infinite-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    /* Left Big Combined Search Card (Occupies 2x2 Grid = 4 Cards Space) */
    .search-card {
      grid-column: 1 / span 2;
      grid-row: 1 / span 2;
      background: var(--surface-1);
      border-radius: 14px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .search-preview {
      width: 220px;
      height: 220px;
      overflow: hidden;
      margin: auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      outline: none;
      background: transparent;
    }

    .search-preview svg,
    .card-svg svg {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      outline: none;
    }

    .search-input-box {
      width: 100%;
      text-align: center;
      margin-top: 20px;
    }

    .search-input-box input {
      width: 100%;
      background: transparent;
      border: 0;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      outline: none;
      padding: 4px 0;
    }

    .search-input-box input::placeholder {
      color: var(--text-alt);
      transition: color 0.15s ease, opacity 0.15s ease;
    }

    .search-input-box input:focus::placeholder {
      color: transparent;
      opacity: 0;
    }

    .search-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 14px;
    }

    /* Right & Below Infinite Grid Cards */
    .grid-card {
      background: var(--surface-1);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      aspect-ratio: 1;
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s ease;
    }

    .grid-card:hover {
      background: var(--surface-2);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--text-alt);
    }

    .card-svg {
      width: 52%;
      aspect-ratio: 1;
      margin: auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Infinite Scroll Sentinel */
    .sentinel {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Toast Notification & Stack Styling */
    .tst-stack {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 99999;
      pointer-events: none;
    }

    .tst-item {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 220px;
      justify-content: center;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.84rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      white-space: nowrap;
      pointer-events: auto;
    }

    .tst-check-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: #34d399;
    }

    .tst-text {
      color: #ffffff;
      font-weight: 500;
    }

    /* Responsive & Mobile Enhancements */
    @media (max-width: 1400px) {
      .infinite-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 1024px) {
      .nav-container {
        padding: 20px 24px;
      }

      .layout-wrapper {
        padding: 0 24px 50px 24px;
      }

      .infinite-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .search-card {
        grid-column: 1 / -1;
        grid-row: auto;
        min-height: auto;
        padding: 32px 24px;
      }
    }

    @media (max-width: 768px) {
      .nav-container {
        padding: 16px 20px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 18px;
        font-size: 0.85rem;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .hero-title-section {
        padding: 48px 16px 36px 16px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 16px;
      }

      .command-bar {
        max-width: 100%;
        padding: 10px 16px;
        font-size: 0.8rem;
        gap: 8px;
      }

      .layout-wrapper {
        padding: 0 16px 40px 16px;
      }

      .infinite-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .search-card {
        padding: 24px 16px;
        border-radius: 12px;
      }

      .search-preview {
        width: 160px;
        height: 160px;
      }

      .search-input-box {
        margin-top: 16px;
      }

      .search-input-box input {
        font-size: 1rem;
      }

      .grid-card {
        padding: 12px;
        border-radius: 12px;
      }

      .card-header {
        font-size: 0.7rem;
      }

      .card-svg {
        width: 58%;
      }

      .toast {
        left: 16px;
        right: 16px;
        bottom: 16px;
        text-align: center;
      }
    }

    @media (max-width: 640px) {

      .nav-links,
      .nav-actions {
        display: none !important;
      }

      .mobile-menu-btn {
        display: inline-flex !important;
      }

      .nav-container {
        padding: 18px 20px;
      }
    }

    @media (max-width: 420px) {
      .infinite-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
